name: Run Lint

on:
    push:
        branches:
            - 'main'
    pull_request:
        branches:
            - '*'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Install & Patch packages
              run: yarn install

            - name: Lint
              run: yarn lint
